name: Temporary v1.21.0 wiring patch

on:
  push:
    branches:
      - feature/v1.21.0-localized-categories-analytics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/v1.21.0-localized-categories-analytics
          fetch-depth: 0
      - name: Apply repository wiring
        run: python .github/scripts/v1210_patch.py
      - name: Remove temporary patch files
        run: rm -f .github/workflows/tmp-v1210-wire-locales-analytics.yml .github/scripts/v1210_patch.py
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire localized categories and traffic analytics runtime"
          git push origin HEAD:feature/v1.21.0-localized-categories-analytics
