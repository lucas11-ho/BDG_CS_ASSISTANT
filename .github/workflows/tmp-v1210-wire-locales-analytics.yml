name: Temporary v1.21.0 wiring patch

on:
  push:
    branches:
      - feature/v1.21.0-localized-categories-analytics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.21.0-localized-categories-analytics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire backend and Admin navigation
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          server = 'backend-api/src/server.js'
          replace_once(server,
          "} from './faq-topics.js';\n",
          "} from './faq-topics.js';\nimport {\n  closeLocalizedContentAnalyticsPools,\n  enrichCategoryListResponse,\n  handleCategoryLocaleAdminRoute,\n  handleTrafficAdminRoute,\n  handleTrafficPublicRoute,\n} from './localized-categories-analytics.js';\n")

          replace_once(server,
          "  'localized-faq-topics',\n  'faq-topic-excel-import-export'\n",
          "  'localized-faq-topics',\n  'faq-topic-excel-import-export',\n  'localized-categories',\n  'first-party-traffic-analytics'\n")

          anchor = """async function authenticatedBulkResponse(request, env, url, path, requestHeaders, signal) {
  const contextUrl = new URL('/admin/platform-context', url.origin);
  const contextRequest = new Request(contextUrl, { method: 'GET', headers: requestHeaders, signal });
  const contextResponse = await api.fetch(contextRequest, env);
  if (!contextResponse.ok) return contextResponse;
  const context = await contextResponse.json();
  const platform = context?.platform || {};
  const access = context?.access || {};
  const scope = { ...platform, ...access };
  const isImport = request.method.toUpperCase() === 'POST' && path.endsWith('/import');
  if (isImport && access.can_write !== true) {
    return new Response(JSON.stringify({ ok: false, error: 'This platform membership is read-only', code: 'PLATFORM_WRITE_DENIED' }), { status: 403, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
  }
  if (isImport && path.includes('/guide/') && access.can_upload_guides !== true) {
    return new Response(JSON.stringify({ ok: false, error: 'Guide upload permission is required for this platform', code: 'GUIDE_UPLOAD_DENIED' }), { status: 403, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
  }
  if (path.startsWith('/admin/content-bulk/faq/')) return handleFaqTopicBulkRoute(request, env, scope);
  return handleBulkContentRoute(request, env, scope);
}
"""
          extension = anchor + """
async function authenticatedContentAnalyticsResponse(request, env, url, path, requestHeaders, signal) {
  const contextRequest = new Request(new URL('/admin/platform-context', url.origin), { method: 'GET', headers: requestHeaders, signal });
  const contextResponse = await api.fetch(contextRequest, env);
  if (!contextResponse.ok) return contextResponse;
  const meRequest = new Request(new URL('/admin/me', url.origin), { method: 'GET', headers: requestHeaders, signal });
  const meResponse = await api.fetch(meRequest, env);
  if (!meResponse.ok) return meResponse;
  const context = await contextResponse.json();
  const me = await meResponse.json();
  const user = me?.user || me || {};
  const access = context?.access || {};
  const scope = { ...(context?.platform || {}), ...access };
  const owner = String(user?.role || '').toLowerCase() === 'owner';
  const permissions = Array.isArray(user?.permissions) ? user.permissions : [];
  const method = request.method.toUpperCase();
  const isWrite = method !== 'GET';
  const denied = (permission) => !owner && !permissions.includes(permission);
  if (path === '/admin/analytics/summary') {
    if (denied('dashboard.view')) return new Response(JSON.stringify({ ok:false,error:'Administrator permission required: dashboard.view',code:'ADMIN_PERMISSION_DENIED' }), { status:403,headers:{ 'Content-Type':'application/json; charset=utf-8' } });
    return handleTrafficAdminRoute(request, env, scope);
  }
  if (path.startsWith('/admin/categories')) {
    const permission = isWrite ? 'content.manage' : 'content.view';
    if (denied(permission)) return new Response(JSON.stringify({ ok:false,error:`Administrator permission required: ${permission}`,code:'ADMIN_PERMISSION_DENIED' }), { status:403,headers:{ 'Content-Type':'application/json; charset=utf-8' } });
    return handleCategoryLocaleAdminRoute(request, env, scope);
  }
  return null;
}
"""
          replace_once(server, anchor, extension)

          old_dispatch = """    let response = path.startsWith('/admin/content-bulk/') && request.method.toUpperCase() !== 'OPTIONS'
      ? await authenticatedBulkResponse(request, env, url, path, requestHeaders, requestAbort.signal)
      : await api.fetch(request, env);
"""
          new_dispatch = """    const method = request.method.toUpperCase();
    const isTrafficWrite = method === 'POST' && (path === '/public/analytics/pageview' || path === '/public/analytics/heartbeat');
    const isContentAnalyticsAdmin = path === '/admin/analytics/summary'
      || path === '/admin/categories/locales'
      || /^\\/admin\\/categories\\/\\d+\\/translations(?:\\/[^/]+)?$/.test(path);
    let response = isTrafficWrite
      ? await handleTrafficPublicRoute(request, env)
      : isContentAnalyticsAdmin
        ? await authenticatedContentAnalyticsResponse(request, env, url, path, requestHeaders, requestAbort.signal)
        : path.startsWith('/admin/content-bulk/') && method !== 'OPTIONS'
          ? await authenticatedBulkResponse(request, env, url, path, requestHeaders, requestAbort.signal)
          : await api.fetch(request, env);
"""
          replace_once(server, old_dispatch, new_dispatch)

          # method is now declared before dispatch; remove the old duplicate declaration.
          replace_once(server, "\n    const method = request.method.toUpperCase();\n    const isFaqWrite", "\n    const isFaqWrite")

          old_faq = """    if (isFaqWrite) {
      await persistFaqTopicFromResponse(response, env, faqTopicFromJsonBody(body));
      response = await enrichFaqTopicResponse(response, env);
    } else if (isFaqRead) {
      response = await enrichFaqTopicResponse(response, env);
    }
"""
          new_faq = old_faq + """    const isCategoryListRead = response.ok && method === 'GET' && (path === '/admin/categories' || path === '/categories' || path === '/public/categories');
    if (isCategoryListRead) {
      response = await enrichCategoryListResponse(response, env, {
        admin: path === '/admin/categories',
        language: url.searchParams.get('language') || url.searchParams.get('lang') || '',
      });
    }
"""
          replace_once(server, old_faq, new_faq)

          replace_once(server,
          "    await closeFaqTopicPools().catch(() => undefined);\n    await closeDatabasePools();",
          "    await closeFaqTopicPools().catch(() => undefined);\n    await closeLocalizedContentAnalyticsPools().catch(() => undefined);\n    await closeDatabasePools();")

          layout = 'admin-pro/src/components/AdminLayout.tsx'
          replace_once(layout,
          "  ApartmentOutlined,\n} from \"@ant-design/icons\";",
          "  ApartmentOutlined,\n  BarChartOutlined,\n} from \"@ant-design/icons\";")
          replace_once(layout,
          "  {\n    key: \"/platform-control-center\",",
          "  {\n    key: \"/analytics\",\n    to: \"/analytics\",\n    label: \"Traffic Analytics\",\n    icon: <BarChartOutlined />,\n    group: \"ANALYTICS\",\n  },\n  {\n    key: \"/platform-control-center\",")
          replace_once(layout,
          "  Dashboard: \"仪表盘\",",
          "  Dashboard: \"仪表盘\",\n  \"Traffic Analytics\": \"流量分析\", ANALYTICS: \"分析\",")
          replace_once(layout,
          "  Dashboard: \"ဒက်ရှ်ဘုတ်\",",
          "  Dashboard: \"ဒက်ရှ်ဘုတ်\", \"Traffic Analytics\": \"ဝဘ်အသုံးပြုမှု ခွဲခြမ်းစိတ်ဖြာမှု\", ANALYTICS: \"ခွဲခြမ်းစိတ်ဖြာမှု\",")
          replace_once(layout,
          "  if (item.key === \"/admin-users\") return \"platform.manage\";",
          "  if (item.key === \"/admin-users\") return \"platform.manage\";\n  if (item.key === \"/analytics\") return \"dashboard.view\";")

          pkg_path = Path('backend-api/package.json')
          pkg = json.loads(pkg_path.read_text())
          check = pkg['scripts']['check']
          marker = 'node --check src/localized-categories-analytics.js'
          if marker not in check:
              check = check.replace('node --check src/faq-topics.js', 'node --check src/faq-topics.js && ' + marker)
              pkg['scripts']['check'] = check
          pkg['scripts']['test:v1210-localized-analytics'] = 'node scripts/v1.21.0-localized-categories-analytics-regression-test.js'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          Path('.github/workflows/tmp-v1210-wire-locales-analytics.yml').unlink()
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire localized categories and traffic analytics runtime"
          git push origin HEAD:feature/v1.21.0-localized-categories-analytics
