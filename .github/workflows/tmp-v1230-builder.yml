name: v1.23.0 one-time integration builder

on:
  push:
    branches:
      - feature/v1.23.0-topics-security-control-center
    paths:
      - scripts/tmp_v1230_builder.py
      - .github/workflows/tmp-v1230-builder.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.23.0 integration edits
        run: python scripts/tmp_v1230_builder.py
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(v1.23.0): integrate multi-topic security control center"
          git push origin HEAD:feature/v1.23.0-topics-security-control-center
