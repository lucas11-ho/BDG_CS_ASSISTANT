name: Temporary v1.23.0 Admin source repair

on:
  push:
    branches:
      - feature/v1.23.0-topics-security-control-center
    paths:
      - .github/workflows/tmp-v1230-admin-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.23.0-topics-security-control-center
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: admin-pro/package-lock.json

      - name: Remove duplicate Admin permission field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin-pro/src/lib/api.ts')
          text = path.read_text()
          duplicate = '''      permissions: Array.isArray(data.permissions) ? data.permissions : undefined,\n      permissions: Array.isArray(data.permissions) ? data.permissions : undefined,\n'''
          if duplicate not in text:
              raise SystemExit('Expected duplicate permissions block was not found')
          path.write_text(text.replace(duplicate, '      permissions: Array.isArray(data.permissions) ? data.permissions : undefined,\n', 1))
          PY

      - name: Regenerate TanStack Admin route tree and verify Admin
        working-directory: admin-pro
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run build
          npm run typecheck

      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/tmp-v1230-admin-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-pro/src/lib/api.ts admin-pro/src/routeTree.gen.ts .github/workflows/tmp-v1230-admin-fix.yml
          git diff --cached --check
          git commit -m "fix(v1.23.0): repair Admin typecheck and generated routes"
          git push origin HEAD:feature/v1.23.0-topics-security-control-center
