name: Temporary v1.24.0 taxonomy builder

on:
  push:
    branches:
      - feature/v1.24.0-content-taxonomy-stable-faq-slugs
    paths:
      - .github/workflows/tmp-v1240-builder.yml

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bdg_integration_test
          POSTGRES_USER: bdg_test
          POSTGRES_PASSWORD: bdg_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_test -d bdg_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://bdg_test:bdg_test_password@127.0.0.1:5432/bdg_integration_test
      VITE_API_BASE: https://api.example.com
      VITE_BDG_API_BASE: https://api.example.com
      VITE_API_BASE_URL: https://api.example.com
      VITE_USE_MOCK: "false"
      VITE_MOCK_MODE: "false"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.24.0-content-taxonomy-stable-faq-slugs
          fetch-depth: 0

      - name: Apply v1.24 integration
        run: python scripts/tmp_v1240_builder.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            admin-pro/package-lock.json
            guide-pro/package-lock.json

      - name: Verify backend taxonomy and migrations
        working-directory: backend-api
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run check
          npm run test:v1230-topics-security
          npm run test:v1240-taxonomy
          npm run test:integration

      - name: Build Admin and regenerate route tree
        working-directory: admin-pro
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run build
          npm run typecheck

      - name: Verify Guide
        working-directory: guide-pro
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run typecheck
          npm run build

      - name: Commit verified implementation
        run: |
          rm -f scripts/tmp_v1240_builder.py .github/workflows/tmp-v1240-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: v1.24.0 content taxonomy and stable FAQ slugs"
          git push origin HEAD:feature/v1.24.0-content-taxonomy-stable-faq-slugs

# rerun: v1.23 compatibility assertions now follow the v1.24 runtime marker
