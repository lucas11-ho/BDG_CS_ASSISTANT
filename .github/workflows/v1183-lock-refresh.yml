name: v1.18.3 temporary lock refresh

on:
  push:
    branches:
      - feature/v1.18.3-platform-brand-localization
    paths:
      - .github/workflows/v1183-lock-refresh.yml
      - guide-pro/package.json
      - chat-pro/package.json
      - admin-pro/package.json
      - staff-pro/package.json

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.18.3-platform-brand-localization
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Refresh npm lockfiles
        run: |
          npm --prefix guide-pro install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix chat-pro install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix admin-pro install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm --prefix staff-pro install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock refresh
        run: |
          if git diff --quiet -- guide-pro/package-lock.json chat-pro/package-lock.json admin-pro/package-lock.json staff-pro/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-pro/package-lock.json chat-pro/package-lock.json admin-pro/package-lock.json staff-pro/package-lock.json
          git commit -m "fix(security): refresh js-yaml 4.3.2 lockfiles"
          git push origin HEAD:feature/v1.18.3-platform-brand-localization
