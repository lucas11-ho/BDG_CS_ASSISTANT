name: Temporary v1.21.0 Divider diagnostic

on:
  push:
    branches:
      - feature/v1.21.0-localized-categories-analytics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find incompatible Divider orientation with exact JS regex
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else if (/\.(?:tsx?|jsx?)$/.test(entry.name)) out.push(full);
            }
            return out;
          }
          let found = 0;
          for (const file of walk('admin-pro/src')) {
            const text = fs.readFileSync(file, 'utf8');
            const regex = /<Divider[^>]*\borientation=["'](?:left|right|center)["']/ig;
            for (const match of text.matchAll(regex)) {
              found += 1;
              const line = text.slice(0, match.index).split('\n').length;
              console.log(`OFFENDER ${file}:${line}: ${match[0]}`);
            }
          }
          console.log(`OFFENDER_COUNT=${found}`);
          NODE
      - name: Reproduce R4 regression
        shell: bash
        run: node backend-api/scripts/v1.17.4-r4-ant-design-v6-type-compatibility-regression-test.js || true
