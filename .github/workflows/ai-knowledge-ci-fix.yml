name: AI Knowledge CI Fix

on:
  push:
    branches:
      - feature/v1.18.1-ai-knowledge
    paths:
      - .github/workflows/ai-knowledge-ci-fix.yml

permissions:
  contents: write

jobs:
  fix-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.18.1-ai-knowledge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-api/scripts/regression-test.js')
          text = path.read_text(encoding='utf-8')
          old1 = 'plainTextAi.includes("No approved Menu & Images item matched this message. Answer from the Assistant Setup")'
          new1 = 'plainTextAi.includes("No approved AI Knowledge or Menu & Images item matched this message. Answer from the Assistant Setup")'
          old2 = 'adminLayout.includes("Assistant Setup") && adminLayout.includes("Menu & Images") && adminLayout.includes("Test & Diagnostics") && menuImagesPage.includes("The only approved business-content source") && promptManagerPage.includes("STANDARD_SECTIONS")'
          new2 = 'adminLayout.includes("Assistant Setup") && adminLayout.includes("AI Knowledge") && adminLayout.includes("Menu & Images") && adminLayout.includes("Test & Diagnostics") && menuImagesPage.includes("Approved menu and media source") && promptManagerPage.includes("STANDARD_SECTIONS")'
          if old1 not in text:
              raise SystemExit('general-question regression marker not found')
          if old2 not in text:
              raise SystemExit('admin-workflow regression marker not found')
          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify regression suite
        run: npm --prefix backend-api run test:regression

      - name: Commit fix
        run: |
          git config user.name "ChatGPT Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-api/scripts/regression-test.js
          git commit -m "test: align regression suite with AI Knowledge"
          git push origin HEAD:feature/v1.18.1-ai-knowledge
