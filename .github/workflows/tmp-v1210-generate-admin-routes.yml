name: Temporary v1.21.0 generate Admin route tree

on:
  push:
    branches:
      - feature/v1.21.0-localized-categories-analytics

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.21.0-localized-categories-analytics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-pro/package-lock.json
      - name: Generate route tree through Vite
        working-directory: admin-pro
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-v1210-generate-admin-routes.yml
      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-pro/src/routeTree.gen.ts .github/workflows/tmp-v1210-generate-admin-routes.yml
          git commit -m "Generate Admin analytics route tree"
          git push origin HEAD:feature/v1.21.0-localized-categories-analytics
