name: Temporary v1.22.1 Admin marker fix

on:
  push:
    branches:
      - feature/v1.22.1-stability-performance-r2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.22.1-stability-performance-r2
          fetch-depth: 0
      - name: Update current Admin version assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            Path('backend-api/scripts/regression-test.js'),
            Path('backend-api/scripts/v1.17.1-dynamic-cors-regression-test.js'),
            Path('backend-api/scripts/v1.17.4-cs-identity-domain-promotion-menu-regression-test.js'),
          ]
          for path in files:
            text = path.read_text()
            text = text.replace('Admin release marker is v1.22.0', 'Admin release marker is v1.22.1')
            text = text.replace('Admin displays current v1.22.0', 'Admin displays current v1.22.1')
            text = text.replace('const ADMIN_VERSION = \\"v1.22.0\\"', 'const ADMIN_VERSION = \\"v1.22.1\\"')
            text = text.replace('const ADMIN_VERSION = "v1.22.0"', 'const ADMIN_VERSION = "v1.22.1"')
            path.write_text(text)
          PY
          git config user.name "lucas11-ho"
          git config user.email "lacus.mm.ph@gmail.com"
          git add backend-api/scripts
          git commit -m "test(v1.22.1): align Admin release assertions"
          git push origin HEAD:feature/v1.22.1-stability-performance-r2
