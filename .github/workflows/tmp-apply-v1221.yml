name: Temporary v1.22.1 stability patch builder

on:
  push:
    branches:
      - feature/v1.22.1-stability-performance-r2

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.22.1-stability-performance-r2
          fetch-depth: 0

      - name: Apply stability patch
        run: |
          python scripts/tmp-apply-v1221.py
          git checkout -- .github/workflows/ci.yml

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            guide-pro/package-lock.json
            admin-pro/package-lock.json

      - name: Verify backend patch
        working-directory: backend-api
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test:v1220-platform-transfer
          npm run test:v1221-stability

      - name: Verify Admin patch
        working-directory: admin-pro
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Verify Guide patch
        working-directory: guide-pro
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit verified patch
        run: |
          git config user.name "lucas11-ho"
          git config user.email "lacus.mm.ph@gmail.com"
          git add -A
          git commit -m "perf: v1.22.1 stability and background traffic controls"
          git push origin HEAD:feature/v1.22.1-stability-performance-r2
