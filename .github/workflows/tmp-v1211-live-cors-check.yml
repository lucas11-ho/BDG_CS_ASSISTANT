name: Temporary v1.21.1 live CORS check

on:
  push:
    branches:
      - diagnostic/v1.21.1-live-cors

permissions:
  contents: read

jobs:
  check-live-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed backend hotfix marker
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --max-time 20 https://bdg-ai-help-api-render.onrender.com/health/live)"
          printf '%s\n' "$health"
          printf '%s' "$health" | grep -q 'content-analytics-cors-preflight'

      - name: Verify Admin CORS preflight routes
        run: |
          set -euo pipefail
          origin='https://bdg-admin-pages.pages.dev'
          for url in \
            'https://bdg-ai-help-api-render.onrender.com/admin/analytics/summary?range=7d' \
            'https://bdg-ai-help-api-render.onrender.com/admin/categories/locales' \
            'https://bdg-ai-help-api-render.onrender.com/admin/categories/1/translations'
          do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 \
              -D "$headers" -o "$body" -w '%{http_code}' \
              -X OPTIONS "$url" \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,x-bdg-platform-route')"
            cat "$headers"
            cat "$body" || true
            test "$code" -ge 200
            test "$code" -lt 300
            grep -qi "^access-control-allow-origin: $origin" "$headers"
            rm -f "$headers" "$body"
          done
