name: Frontend Audit Refresh

on:
  push:
    branches:
      - feature/v1.18.1-ai-knowledge
    paths:
      - .github/workflows/frontend-audit-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE: https://api.example.com
      VITE_BDG_API_BASE: https://api.example.com
      VITE_API_BASE_URL: https://api.example.com
      VITE_USE_MOCK: "false"
      VITE_MOCK_MODE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.18.1-ai-knowledge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org

      - name: Refresh audit-safe frontend lockfiles
        run: |
          npm --prefix guide-pro audit fix --package-lock-only --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix chat-pro audit fix --package-lock-only --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix admin-pro audit fix --package-lock-only --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org/ || true
          npm --prefix staff-pro audit fix --package-lock-only --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Verify Guide
        run: |
          npm --prefix guide-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix guide-pro run typecheck
          npm --prefix guide-pro run build
          npm --prefix guide-pro audit --audit-level=high

      - name: Verify Chat
        run: |
          npm --prefix chat-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix chat-pro run typecheck
          npm --prefix chat-pro run build
          npm --prefix chat-pro audit --audit-level=high

      - name: Verify Admin
        run: |
          npm --prefix admin-pro ci --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix admin-pro run test:customer-service-route
          npm --prefix admin-pro run typecheck
          npm --prefix admin-pro run build
          npm --prefix admin-pro audit --audit-level=high

      - name: Verify Staff
        run: |
          npm --prefix staff-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix staff-pro run typecheck
          npm --prefix staff-pro run build
          npm --prefix staff-pro audit --audit-level=high

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "ChatGPT Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-pro/package-lock.json chat-pro/package-lock.json admin-pro/package-lock.json staff-pro/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile updates required"
          else
            git commit -m "chore: refresh frontend audit-safe lockfiles"
            git push origin HEAD:feature/v1.18.1-ai-knowledge
          fi
