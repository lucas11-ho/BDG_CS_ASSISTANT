name: BDG Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend-api/**
      - admin-pro/**
      - chat-pro/**
      - guide-pro/**
      - staff-pro/**
      - package.json
      - package-lock.json
      - .github/workflows/bdg-production-release.yml
      - scripts/ci/**

permissions:
  contents: read

concurrency:
  group: bdg-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish BDG production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bdg_release_test
          POSTGRES_USER: bdg_test
          POSTGRES_PASSWORD: bdg_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_test -d bdg_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BDG_API_BASE_URL: https://bdg-ai-help-api-render.onrender.com
      TEST_DATABASE_URL: postgresql://bdg_test:bdg_test_password@127.0.0.1:5432/bdg_release_test
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Get the release source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            guide-pro/package-lock.json
            chat-pro/package-lock.json
            admin-pro/package-lock.json
            staff-pro/package-lock.json

      - name: Check Cloudflare release secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID. Open the setup guide and add it before running a release."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN. Open the setup guide and add it before running a release."; exit 1; }

      - name: Read and validate the API release version
        id: api_version
        run: |
          VERSION="$(node scripts/ci/read-api-version.mjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Check backend source
        run: |
          npm --prefix backend-api ci --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix backend-api run check
          npm --prefix backend-api run test:regression
          npm --prefix backend-api run test:prompt-runtime
          npm --prefix backend-api run test:simplified-ai
          npm --prefix backend-api run test:support
          npm --prefix backend-api run test:v1161
          npm --prefix backend-api run test:v1162
          npm --prefix backend-api run test:v1163
          npm --prefix backend-api run test:v1164
          npm --prefix backend-api run test:v1170
          npm --prefix backend-api run test:v1171
          npm --prefix backend-api run test:v1171r2
          npm --prefix backend-api run test:v1172
          npm --prefix backend-api run test:v1172r2
          npm --prefix backend-api run test:v1173
          npm --prefix backend-api run test:v1174
          npm --prefix backend-api run test:v1174r1
          npm --prefix backend-api run test:v1174r2
          npm --prefix backend-api run test:v1174r3
          npm --prefix backend-api run test:v1174r4
          npm --prefix backend-api run test:v1180r1
          npm --prefix backend-api run test:v1181-ai-knowledge
          npm --prefix backend-api run test:security
          npm --prefix backend-api run test:chat-reliability
          npm --prefix backend-api run test:structured
          npm --prefix backend-api run test:upload
          npm --prefix backend-api run test:integration
          npm --prefix backend-api audit --audit-level=high

      - name: Wait for the matching Render release
        run: node scripts/ci/wait-for-render.mjs "${{ steps.api_version.outputs.version }}"

      - name: Align Cloudflare Pages production branches
        run: node scripts/ci/align-pages-production-branches.mjs

      - name: Build and publish Guide production
        run: |
          npm --prefix guide-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix guide-pro run typecheck
          VITE_API_BASE="$BDG_API_BASE_URL" VITE_USE_MOCK=false npm --prefix guide-pro run build
          node scripts/ci/write-release-marker.mjs guide guide-pro/dist "${{ steps.api_version.outputs.version }}" "$GITHUB_SHA"
          node scripts/ci/verify-static-release.mjs guide guide-pro/dist
          npx --yes wrangler@4.107.0 pages deploy guide-pro/dist --project-name bdg-guide-pages --branch main --skip-caching --commit-message "BDG ${{ steps.api_version.outputs.version }} $GITHUB_SHA" --commit-dirty=true

      - name: Build and publish Chat production
        run: |
          npm --prefix chat-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix chat-pro run typecheck
          VITE_BDG_API_BASE="$BDG_API_BASE_URL" VITE_API_BASE="$BDG_API_BASE_URL" npm --prefix chat-pro run build
          node scripts/ci/write-release-marker.mjs chat chat-pro/dist "${{ steps.api_version.outputs.version }}" "$GITHUB_SHA"
          node scripts/ci/verify-static-release.mjs chat chat-pro/dist
          npx --yes wrangler@4.107.0 pages deploy chat-pro/dist --project-name bdg-chat-pages --branch main --skip-caching --commit-message "BDG ${{ steps.api_version.outputs.version }} $GITHUB_SHA" --commit-dirty=true

      - name: Build and publish Staff production
        run: |
          npm --prefix staff-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix staff-pro run typecheck
          VITE_API_BASE_URL="$BDG_API_BASE_URL" npm --prefix staff-pro run build
          node scripts/ci/write-release-marker.mjs staff staff-pro/dist "${{ steps.api_version.outputs.version }}" "$GITHUB_SHA"
          node scripts/ci/verify-static-release.mjs staff staff-pro/dist
          npx --yes wrangler@4.107.0 pages deploy staff-pro/dist --project-name bdg-staff-pages --branch main --skip-caching --commit-message "BDG ${{ steps.api_version.outputs.version }} $GITHUB_SHA" --commit-dirty=true

      - name: Build and publish Admin production
        run: |
          npm --prefix admin-pro ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm --prefix admin-pro run test:customer-service-route
          npm --prefix admin-pro run typecheck
          VITE_API_BASE_URL="$BDG_API_BASE_URL" VITE_MOCK_MODE=false npm --prefix admin-pro run build
          node scripts/ci/write-release-marker.mjs admin admin-pro/dist "${{ steps.api_version.outputs.version }}" "$GITHUB_SHA"
          node scripts/ci/verify-static-release.mjs admin admin-pro/dist
          npx --yes wrangler@4.107.0 pages deploy admin-pro/dist --project-name bdg-admin-pages --branch main --skip-caching --commit-message "BDG ${{ steps.api_version.outputs.version }} $GITHUB_SHA" --commit-dirty=true

      - name: Confirm the live Pages releases
        run: node scripts/ci/verify-live-pages.mjs "${{ steps.api_version.outputs.version }}" "$GITHUB_SHA"

      - name: Release summary
        run: |
          {
            echo "## BDG production release complete"
            echo
            echo "- API version: \`${{ steps.api_version.outputs.version }}\`"
            echo "- Guide: https://bdg-guide-pages.pages.dev"
            echo "- Chat: https://bdg-chat-pages.pages.dev"
            echo "- Admin: https://bdg-admin-pages.pages.dev"
            echo "- Staff: https://bdg-staff-pages.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
