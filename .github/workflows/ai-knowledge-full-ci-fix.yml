name: AI Knowledge Remaining CI Fix

on:
  push:
    branches:
      - feature/v1.18.1-ai-knowledge
    paths:
      - .github/workflows/ai-knowledge-full-ci-fix.yml

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bdg_integration_test
          POSTGRES_USER: bdg_test
          POSTGRES_PASSWORD: bdg_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_test -d bdg_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://bdg_test:bdg_test_password@127.0.0.1:5432/bdg_integration_test
      VITE_API_BASE: https://api.example.com
      VITE_BDG_API_BASE: https://api.example.com
      VITE_API_BASE_URL: https://api.example.com
      VITE_USE_MOCK: "false"
      VITE_MOCK_MODE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.18.1-ai-knowledge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Align schema and remaining regression contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('backend-api/src/core.js')
          text = core.read_text(encoding='utf-8')
          old = "ORDER BY priority ASC, updated_at DESC, id DESC\n    LIMIT $3::integer"
          new = "ORDER BY priority ASC, created_at DESC, id DESC\n    LIMIT $3::integer"
          if old not in text:
              raise SystemExit('AI Knowledge catalog ordering marker not found')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')

          changed=[]
          for path in Path('backend-api/scripts').glob('*.js'):
              text=path.read_text(encoding='utf-8')
              updated=text.replace('assert.match(adminLayout,/v1\\.18\\.0/)', 'assert.match(adminLayout,/v1\\.18\\.1/)')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated regression files:', changed)
          PY

      - name: Install backend
        run: npm --prefix backend-api ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run remaining backend gates
        run: |
          npm --prefix backend-api run check
          npm --prefix backend-api run test:v1173
          npm --prefix backend-api run test:v1174
          npm --prefix backend-api run test:v1174r1
          npm --prefix backend-api run test:v1174r2
          npm --prefix backend-api run test:v1174r3
          npm --prefix backend-api run test:v1174r4
          npm --prefix backend-api run test:v1180r1
          npm --prefix backend-api run test:v1181-ai-knowledge
          npm --prefix backend-api run test:chat-reliability
          npm --prefix backend-api run test:security
          npm --prefix backend-api run test:structured
          npm --prefix backend-api run test:upload
          npm --prefix backend-api run test:integration
          npm --prefix backend-api audit --audit-level=high

      - name: Commit verified schema compatibility fix
        run: |
          git config user.name "ChatGPT Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-api/src/core.js backend-api/scripts/v1.17.3-support-workspace-ux-regression-test.js
          git commit -m "fix: align AI Knowledge retrieval with existing schema"
          git push origin HEAD:feature/v1.18.1-ai-knowledge
