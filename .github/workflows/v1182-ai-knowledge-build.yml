name: Temporary v1.18.2 AI Knowledge Build

on:
  push:
    branches:
      - feature/v1.18.2-ai-knowledge-import-semantic

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adapt guarded patch to CI command shape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/apply-v1182-ai-knowledge-build.mjs')
          source = path.read_text()
          marker = "for (const rel of ['.github/workflows/ci.yml', '.github/workflows/bdg-production-release.yml']) {"
          replacement = """patch('.github/workflows/ci.yml', (source) => replaceOnce(
            source,
            '          npm run test:v1181-ai-knowledge\\n',
            '          npm run test:v1181-ai-knowledge\\n          npm run test:v1182-ai-knowledge\\n',
            '.github/workflows/ci.yml v1.18.2 test',
          ));

          for (const rel of ['.github/workflows/bdg-production-release.yml']) {"""
          if source.count(marker) != 1:
              raise SystemExit('Could not find the workflow patch marker exactly once')
          path.write_text(source.replace(marker, replacement, 1))
          PY
      - name: Apply guarded source patch
        run: node scripts/ci/apply-v1182-ai-knowledge-build.mjs
      - name: Restore temporary patch helper
        run: git checkout -- scripts/ci/apply-v1182-ai-knowledge-build.mjs
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit patched feature source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-api admin-pro scripts .github/workflows/ci.yml .github/workflows/bdg-production-release.yml
          git commit -m "feat: build AI Knowledge Excel library and answer-first retrieval"
          git push origin HEAD:feature/v1.18.2-ai-knowledge-import-semantic
