name: Temporary v1.22.1 backend diagnostic

on:
  push:
    branches:
      - feature/v1.22.1-stability-performance-r2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bdg_integration_test
          POSTGRES_USER: bdg_test
          POSTGRES_PASSWORD: bdg_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_test -d bdg_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://bdg_test:bdg_test_password@127.0.0.1:5432/bdg_integration_test
      VITE_API_BASE: https://api.example.com
      VITE_BDG_API_BASE: https://api.example.com
      VITE_API_BASE_URL: https://api.example.com
      VITE_USE_MOCK: "false"
      VITE_MOCK_MODE: "false"
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: backend-api/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: regression
        run: npm run test:regression
      - name: prompt runtime
        run: npm run test:prompt-runtime
      - name: simplified AI
        run: npm run test:simplified-ai
      - name: support
        run: npm run test:support
      - name: v1161
        run: npm run test:v1161
      - name: v1162
        run: npm run test:v1162
      - name: v1163
        run: npm run test:v1163
      - name: v1164
        run: npm run test:v1164
      - name: v1170
        run: npm run test:v1170
      - name: v1171
        run: npm run test:v1171
      - name: v1171r2
