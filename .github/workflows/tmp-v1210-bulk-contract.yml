name: Temporary v1.21.0 bulk contract compatibility patch

on:
  push:
    branches:
      - feature/v1.21.0-localized-categories-analytics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.21.0-localized-categories-analytics
          fetch-depth: 0
      - name: Apply compatibility patch
        run: python .github/scripts/v1210_bulk_contract_patch.py
      - name: Remove temporary patch files
        run: rm -f .github/workflows/tmp-v1210-bulk-contract.yml .github/scripts/v1210_bulk_contract_patch.py
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve bulk-content dispatch regression contract"
          git push origin HEAD:feature/v1.21.0-localized-categories-analytics
